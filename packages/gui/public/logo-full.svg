<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-label="AI Config Manager">
  <title>AI Config Manager</title>
  <defs>
    <linearGradient id="aacm-edge" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8b5cf6"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <!-- Molecule-network edges: cyan accents on the outer nodes, purple elsewhere -->
  <g stroke-width="16" stroke-linecap="round" fill="none">
    <g stroke="#22d3ee">
      <line x1="512" y1="512" x2="192" y2="272"/>
      <line x1="512" y1="512" x2="832" y2="272"/>
      <line x1="512" y1="512" x2="832" y2="752"/>
    </g>
    <g stroke="#8b5cf6">
      <line x1="512" y1="512" x2="192" y2="752"/>
      <line x1="192" y1="272" x2="832" y2="272"/>
      <line x1="832" y1="272" x2="832" y2="752"/>
      <line x1="832" y1="752" x2="192" y2="752"/>
      <line x1="192" y1="752" x2="192" y2="272"/>
    </g>
  </g>
  <!-- Central hexagon: purple outline, faint center fill for dark-theme depth -->
  <polygon points="512,388 619,450 619,574 512,636 405,574 405,450" fill="rgba(139,92,246,0.12)" stroke="#8b5cf6" stroke-width="24" stroke-linejoin="round"/>
  <!-- Outer nodes: cyan accents -->
  <g fill="#22d3ee">
    <circle cx="192" cy="272" r="40"/>
    <circle cx="832" cy="272" r="40"/>
    <circle cx="832" cy="752" r="40"/>
  </g>
  <!-- Outer nodes: purple -->
  <g fill="#8b5cf6">
    <circle cx="192" cy="752" r="40"/>
  </g>
</svg>
