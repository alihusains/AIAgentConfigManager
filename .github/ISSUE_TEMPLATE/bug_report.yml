name: Bug report
description: Something is broken or behaves unexpectedly
title: "[Bug] "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: Describe the unexpected behavior plainly — no jargon needed.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: e.g. v0.1.0 (or "built from main")
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: The commands you ran (`ai-config …`) or the dashboard actions you used.
    validations:
      required: true
  - type: input
    id: agent
    attributes:
      label: Which agent/tool is involved?
      description: e.g. Claude Code, Codex, opencode, Cursor CLI, Cline, Aider… (or "none / the tool itself")
    validations:
      required: true
  - type: dropdown
    id: os
    attributes:
      label: Operating system
      options:
        - macOS
        - Linux
        - Windows (unsupported, but tell us anyway)
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - CLI
        - Dashboard (GUI)
        - Provider verification
        - MCP servers
        - Adapter / agent config writing
        - Documentation
        - Other
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant output (optional)
      description: Paste terminal output or browser console errors. Redact any API keys!